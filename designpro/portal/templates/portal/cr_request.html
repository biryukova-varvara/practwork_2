{% extends 'portal/base_generic.html' %}
{% block content %}
<h2>Создать новую заявку</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Отправить заявку</button>
    <a href="{% url 'profile' %}">Отмена</a>
</form>
{% endblock %}
