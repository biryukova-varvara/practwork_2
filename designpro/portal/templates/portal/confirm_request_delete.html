{% extends 'portal/base_generic.html' %}
{% block content %}
<h2>Подтвердите действие</h2>
<p>Вы уверены, что хотите удалить заявку <strong>"{{ req.title }}"</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'profile' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
