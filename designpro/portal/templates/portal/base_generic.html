<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Design.pro</title>
</head>
<body>
    <ul class="sidebar-nav">
      <div class="container">
        <li><a href="{% url 'home' %}">Design.pro</a></li>
        {% if user.is_authenticated %}
        <span>{{ user.username }}</span>
        <li><a href="{% url 'profile' %}">Ваш профиль</a></li>
        <li>
              <form method="post" action="{% url 'logout' %}" >
                {% csrf_token %}
                <button type="submit">Выход</button>
              </form>
        </li>
        {% else %}
        <li><a href="{% url 'login' %}">Вход</a></li>
        <li><a href="{% url 'registration' %}">Регистрация</a></li>
        {% endif %}
        {% if user.is_staff %}
            <a href="{% url 'admin_requests' %}">Для администраторов сайта</a>
        {% endif %}
      </div>
    </ul>
    <div>{% block content %}{% endblock %}
</body>
</html>
