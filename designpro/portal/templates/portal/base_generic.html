<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Design.pro</title>
    </head>
<body>
    <ul class="sidebar-nav">
      <div class="container">
        <li><a href="{% url 'home' %}">Design.pro</a></li>
        {% if user.is_authenticated %}
        <span>{{ user.username }}</span>
        <li><a href="{% url 'profile' %}">Ваш профиль</a></li>
        <li>
              <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-link nav-link">Выход</button>
              </form>
        </li>
        {% else %}
        <li><a href="{% url 'login' %}">Вход</a></li>
        <li><a href="{% url 'registration' %}">Регистрация</a></li>
        {% endif %}
      </div>
    </ul>
    <div class="col-sm-10 ">{% block content %}{% endblock %}
</body>
</html>
