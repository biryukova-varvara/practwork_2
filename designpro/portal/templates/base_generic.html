<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design.PRO</title>
</head>
<body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-2">
          {% block sidebar %}
            <ul class="sidebar-nav">
              <li><a href="{% url 'index' %}">На главную</a></li>
              <li>Профиль</li>
              <li>Все категории</li>
              {% if user.is_authenticated %}
              <li>User: {{ user.get_username }}</li>
              <li>Мои заявки</li>
              <li>
                <form id="logout-form" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link">Выйти</button>
                </form>
              </li>
              {% else %}
              <li><a href="{% url 'login' %}?next={{ request.path }}">Войти в аккаунт</a></li>
              {% endif %}
            </ul>
          {% endblock %}
        </div>
        <div class="col-sm-10 ">{% block content %}{% endblock %}
</body>
</html>
