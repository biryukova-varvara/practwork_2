{% extends 'portal/base_generic.html' %}
{% block content %}
<div>
    <h2>Управление категориями</h2>
    <a href="{% url 'add_category' %}" class="btn">Добавить категорию</a>
</div>

<div>
    {% for cat in categories %}
    <div>
        <span>{{ cat.name }} <a href="{% url 'delete_category' cat.pk %}">Удалить</a></span>
    </div>
    {% empty %}
    <div>
        <p>Категорий пока нет.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
